[tool]
name = "cloakbrowser-mcp"
version = "1.3.0"
description = "Playwright MCP-compatible browser automation bridge that runs upstream Playwright MCP with CloakBrowser Chromium."
author = "swimmwatch"
homepage = "https://github.com/swimmwatch/cloakbrowser-mcp"
license = "MIT"

[binary]
entry = "cloakbrowser-mcp"
platforms = ["linux-x86_64"]

[runtime]
runner = "npx"
package = "cloakbrowser-mcp"
args = ["-y", "cloakbrowser-mcp@latest"]
transport = "stdio"

[permissions]
filesystem = ["read:~/", "write:~/.cache/cloakbrowser", "write:.playwright-mcp", "write:/tmp/cloakbrowser-artifacts"]
network = true
allow_exec = true
env_vars = [
  "HOME",
  "PATH",
  "TMPDIR",
  "PLAYWRIGHT_MCP_OUTPUT_DIR",
  "PLAYWRIGHT_MCP_HEADLESS",
  "PLAYWRIGHT_MCP_BROWSER_ENGINE",
  "PLAYWRIGHT_MCP_OUTPUT_MODE",
  "CLOAK_PLAYWRIGHT_MCP_TRANSPORT",
  "CLOAK_PLAYWRIGHT_MCP_HTTP_HOST",
  "CLOAK_PLAYWRIGHT_MCP_HTTP_PORT",
  "CLOAK_PLAYWRIGHT_MCP_HTTP_ENDPOINT",
  "CLOAK_PLAYWRIGHT_MCP_HTTP_AUTH_TOKEN",
  "CLOAK_PLAYWRIGHT_MCP_CONSOLE_FALLBACK",
  "CLOAK_PLAYWRIGHT_MCP_STEALTH_ARGS",
  "CLOAK_PLAYWRIGHT_MCP_EXTRA_ARGS",
]
max_memory_mb = 1024
max_cpu_percent = 90

[[mcp.tools]]
name = "browser_click"
description = "Click a page element through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "browser_close"
description = "Close the browser session through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "browser_console_messages"
description = "Read browser console messages through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "browser_drag"
description = "Drag between page elements through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "browser_drop"
description = "Drop a dragged item through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "browser_evaluate"
description = "Evaluate JavaScript in the page context through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "browser_file_upload"
description = "Upload a local file to a page input through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "browser_fill_form"
description = "Fill page form fields through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "browser_handle_dialog"
description = "Handle browser dialogs through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "browser_hover"
description = "Hover over a page element through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "browser_navigate"
description = "Navigate the browser to a URL through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "browser_navigate_back"
description = "Navigate back in browser history through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "browser_network_request"
description = "Inspect a browser network request through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "browser_network_requests"
description = "List browser network requests through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "browser_press_key"
description = "Press a keyboard key through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "browser_resize"
description = "Resize the browser viewport through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "browser_run_code_unsafe"
description = "Run Playwright code through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "browser_select_option"
description = "Select a page option through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "browser_snapshot"
description = "Capture the page accessibility snapshot through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "browser_tabs"
description = "List and manage browser tabs through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "browser_take_screenshot"
description = "Capture a page screenshot through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "browser_type"
description = "Type text into a page element through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "browser_wait_for"
description = "Wait for page state through the forwarded Playwright MCP browser tool."

[[mcp.tools]]
name = "cloakbrowser_binary_info"
description = "Return CloakBrowser package, cache, platform, and resolved browser binary information."

[[mcp.tools]]
name = "cloakbrowser_bridge_info"
description = "Return runtime metadata for the CloakBrowser bridge over upstream Playwright MCP."
